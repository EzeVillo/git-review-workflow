# Unique pin source for platform line / branch / plugin id (plan.md Technical Context).
# Verified 2026-08-08 against JetBrains build-number-ranges table:
#   2026.2 requires Java 25; this environment has JDK 21 → pin 2026.1 / branch 261.
pluginGroup = com.ezevillo
pluginName = git-review-workflow
pluginVersion = 0.1.0
pluginSinceBuild = 261
# Open-ended until-build (all future 261+ builds); pluginVerifier covers compatibility.
pluginUntilBuild =

# Platform product is selected in build.gradle.kts via intellijIdea(version)
# (IC is no longer published since 2025.3).
platformVersion = 2026.1

# IntelliJ Platform Gradle Plugin version
intellijPlatformGradlePluginVersion = 2.18.1
kotlin.version = 2.3.20

# Opt-out of bundling Kotlin stdlib (platform already ships it)
kotlin.stdlib.default.dependency = false

# Config cache off: some verification tasks still touch Project in doLast.
org.gradle.configuration-cache = false
org.gradle.caching = true
