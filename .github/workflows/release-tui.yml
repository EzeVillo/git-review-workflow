name: release-tui

on:
  push:
    tags:
      - "tui-v*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: gofmt
        working-directory: tui
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        working-directory: tui
        run: go vet ./...
      - name: go test
        working-directory: tui
        run: go test ./...
      - name: Client product surface
        run: node scripts/check-client-product-surface.mjs

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Build seven static binaries
        working-directory: tui
        run: |
          set -eu
          version="${GITHUB_REF_NAME#tui-v}"
          stamped="$(sed -nE 's#^const TUIVersion = "([^"]*)"#\1#p' internal/domain/version.go)"
          if [ "$version" != "$stamped" ]; then
            echo "tag is ${GITHUB_REF_NAME} but version.go has TUIVersion=${stamped}." >&2
            exit 1
          fi
          mkdir -p dist work
          build_tar() {
            goos="$1" goarch="$2" suffix="$3"
            out="git-review-ui_${version}_${suffix}.tar.gz"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w" -o work/git-review-ui ./cmd/git-review-ui
            tar -czf "dist/$out" -C work git-review-ui
          }
          build_zip() {
            goarch="$1" suffix="$2"
            out="git-review-ui_${version}_${suffix}.zip"
            CGO_ENABLED=0 GOOS=windows GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w" -o work/git-review-ui.exe ./cmd/git-review-ui
            (cd work && zip -q "../dist/$out" git-review-ui.exe)
          }
          build_tar darwin arm64 darwin_arm64
          build_tar darwin amd64 darwin_amd64
          build_tar linux amd64 linux_amd64
          build_tar linux arm64 linux_arm64
          GOARM=7 build_tar linux arm linux_armv7
          build_zip amd64 windows_amd64
          build_zip arm64 windows_arm64
          (cd dist && sha256sum git-review-ui_*.tar.gz git-review-ui_*.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: tui-release-assets
          path: tui/dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # This job used to download the assets and nothing else. It needs the
      # tagged tree now, for tui/CHANGELOG.md -- the release body comes from
      # its section rather than from --generate-notes.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tui-release-assets
          path: dist
      - name: Assert all seven assets exist and match SHA256SUMS
        run: |
          set -eu
          version="${GITHUB_REF_NAME#tui-v}"
          assets="
          git-review-ui_${version}_darwin_arm64.tar.gz
          git-review-ui_${version}_darwin_amd64.tar.gz
          git-review-ui_${version}_linux_amd64.tar.gz
          git-review-ui_${version}_linux_arm64.tar.gz
          git-review-ui_${version}_linux_armv7.tar.gz
          git-review-ui_${version}_windows_amd64.zip
          git-review-ui_${version}_windows_arm64.zip"
          for asset in $assets; do
            if [ ! -s "dist/$asset" ]; then
              echo "missing or empty release asset: $asset" >&2
              exit 1
            fi
          done
          if [ ! -s dist/SHA256SUMS ]; then
            echo "missing or empty SHA256SUMS" >&2
            exit 1
          fi
          expected="$(printf '%s\n' $assets | sort)"
          covered="$(sed -E 's#^[0-9a-fA-F]+  \*?##' dist/SHA256SUMS | sort)"
          if [ "$covered" != "$expected" ]; then
            echo "SHA256SUMS does not cover exactly the seven release assets" >&2
            exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS)
      # Notes come from tui/CHANGELOG.md, not --generate-notes, which listed
      # every commit since the previous tag -- the four clients share this
      # history, so a TUI release was enumerating the CLI's commits too.
      #
      # index($0, v) == 1, NOT $0 == v: the heading carries a date, so an
      # equality match never fires. That exact bug shipped in jetbrains-v0.3.0,
      # whose release body is the fallback line instead of its notes.
      - name: Create non-latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#tui-v}"
          notes="$(mktemp)"
          awk -v v="## [${version}]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' "$GITHUB_WORKSPACE/tui/CHANGELOG.md" >"$notes"
          if [ ! -s "$notes" ]; then
            echo "See tui/CHANGELOG.md" >"$notes"
          fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Terminal TUI ${GITHUB_REF_NAME#tui-v}" \
            --latest=false \
            --notes-file "$notes"
      - name: Pin Homebrew checksums on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          work="$(mktemp -d)"
          git clone --depth 1 --branch "$DEFAULT_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"
          cd "$work"
          sed_i() {
            _t="$(mktemp)"
            sed -E "$1" "$2" >"$_t" && mv "$_t" "$2"
          }
          f="Formula/git-review-ui.rb"
          for suffix in \
            darwin_arm64.tar.gz darwin_amd64.tar.gz \
            linux_amd64.tar.gz linux_arm64.tar.gz; do
            asset="git-review-ui_${GITHUB_REF_NAME#tui-v}_${suffix}"
            sum="$(awk -v name="$asset" '$2 == name {print $1}' "$GITHUB_WORKSPACE/dist/SHA256SUMS")"
            if [ -z "$sum" ]; then
              echo "SHA256SUMS has no entry for $asset" >&2
              exit 1
            fi
            sed_i "/_${suffix}/{n;s#^([ ]+sha256 ).*#\1\"${sum}\"#;}" "$f"
          done
          if git diff --quiet -- "$f"; then
            echo "formula checksums already pinned; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Pin terminal TUI formula to ${GITHUB_REF_NAME} [skip ci]" -- "$f"
          git push origin "HEAD:${DEFAULT_BRANCH}"
