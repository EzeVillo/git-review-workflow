name: ci

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # bin/, el wrapper de Gradle y todo *.sh propio: un checkout de Windows no
      # lleva el bit de ejecución, así que un archivo agregado desde ahí llega a
      # 100644 y sólo muere en los runners POSIX (`./gradlew: Permission
      # denied`) — así entró visualstudio-extension/bump-version.sh, que
      # CONTRIBUTING.md manda correr como `./visualstudio-extension/...`.
      # .specify/ queda afuera: es vendoreado, no nuestro.
      - name: Check bin scripts are executable
        run: |
          missing=$(git ls-files -s bin/ jetbrains-plugin/gradlew '*.sh' ':(exclude).specify/**' | awk '$1 != "100755" && $4 !~ /\/\.gitkeep$/ {print $4}')
          if [ -n "$missing" ]; then
            echo "These files are missing the executable bit (100755):" >&2
            echo "$missing" >&2
            echo "Fix with: git update-index --chmod=+x <file>" >&2
            exit 1
          fi
      - name: Install shellcheck
        run: |
          case "$RUNNER_OS" in
            macOS) brew install shellcheck ;;
            Windows) choco install shellcheck --no-progress -y ;;
            *) sudo apt-get update && sudo apt-get install -y shellcheck ;;
          esac
      - name: shellcheck
        # find recorre bin/ (incl. bin/git-review-verbs/, fuera del glob bin/*) y
        # excluye .gitkeep; cubre el dispatcher y todos los verbos.
        run: shellcheck $(find bin -type f ! -name '.gitkeep') install.sh uninstall.sh web-install.sh web-uninstall.sh bump-version.sh vscode-extension/bump-version.sh jetbrains-plugin/bump-version.sh visualstudio-extension/bump-version.sh jetbrains-plugin/verification-report.sh tests/sandbox.sh tests/sandbox-min.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # One source and one pinned version on all three runners. Installing from
      # apt/brew/npm gave three different versions of bats, so a flag that
      # worked on the newest could abort the suite on the oldest (Ubuntu's apt
      # bats is several majors behind) and the failure only showed up in CI.
      # Keep in sync with tests/Dockerfile, which runs the same suite locally.
      - name: Install bats
        run: npm install -g bats@1.13.0
      - name: Run tests
        run: bats tests/

  vscode-extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @vscode/test-electron >= 3 declara engines.node >= 22, y es la
          # primera versión que ubica el binario de macOS por el
          # CFBundleExecutable del Info.plist en vez de asumir el histórico
          # `Contents/MacOS/Electron`: VS Code lo renombró a `Code` en 1.110
          # (microsoft/vscode#291948) y borró el symlink de compatibilidad en
          # microsoft/vscode#326502, así que las stable actuales ya no lo traen
          # y la 2.x muere con ENOENT al lanzar el host — sólo en macOS, porque
          # el archive de Windows sigue teniendo `Code.exe` en la raíz.
          node-version: 22
      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm install
      - name: Compile and typecheck
        working-directory: vscode-extension
        run: npm run pretest
      - name: Unit tests
        working-directory: vscode-extension
        run: npm run test:unit
      # Los fixtures construyen repos invocando `git review` de verdad
      # (research.md Decisión 11, "deuda anotada"), y runTests.ts pone el
      # bin/ del checkout al frente del PATH que hereda el host, así que
      # tanto el fixture como la extensión corren la CLI de este árbol: no
      # hace falta instalarla antes. install.sh tiene su propia cobertura en
      # tests/install.bats, sobre los mismos tres runners.
      - name: Integration tests
        working-directory: vscode-extension
        run: |
          case "$RUNNER_OS" in
            Linux) xvfb-run -a npm run test:integration ;;
            *) npm run test:integration ;;
          esac

  client-product-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check multi-client product surface
        run: node scripts/check-client-product-surface.mjs
      # Same job on purpose: node is already set up, and both checks guard the
      # same thing — a surface the clients share drifting apart in one of them.
      - name: Check logo assets
        run: node scripts/check-logo-assets.mjs

  jetbrains-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Platform 2026.1 requires Java 21 (see jetbrains-plugin/gradle.properties).
          java-version: 21
          # Also what release-jetbrains.yml restores: Actions caches are scoped
          # per branch and a tag is not the default branch, so the only cache a
          # `jetbrains-v*` run can read is the one this job wrote on the last
          # push to the default branch. Without it every release re-downloads
          # one IDE build per verified product.
          cache: gradle
      - name: Domain unit tests
        working-directory: jetbrains-plugin
        # bash so the POSIX gradlew wrapper runs on Windows runners too
        shell: bash
        run: ./gradlew test --no-daemon
      - name: Domain no-IntelliJ import rule
        working-directory: jetbrains-plugin
        shell: bash
        run: ./gradlew checkDomainNoIntellij --no-daemon
      - name: Platform tests (Linux only)
        if: runner.os == 'Linux'
        working-directory: jetbrains-plugin
        shell: bash
        run: ./gradlew platformTest --no-daemon

      # The verifications JetBrains ships, on every push instead of only at
      # release time. All three exit zero over findings that are warnings --
      # a since-build below the target platform, a name the Marketplace will
      # object to, a deprecated or internal API the plugin reached for -- so
      # the output is teed and verification-report.sh turns what they said
      # into annotations on the run. Real problems still fail the step on
      # their own; warnings only have to be visible before a version is
      # public, which is the one thing a release-only run cannot do.
      #
      # Linux only, like platformTest: the findings are about the descriptor
      # and the bytecode, and neither depends on the runner.
      - name: Plugin configuration and structure (Linux only)
        if: runner.os == 'Linux'
        working-directory: jetbrains-plugin
        shell: bash
        run: |
          set -o pipefail
          ./gradlew verifyPluginProjectConfiguration verifyPluginStructure --no-daemon 2>&1 | tee verification.log
      # -PverifierIdes=idea: one IDE here, all eight at release. See the
      # comment on pluginVerification in build.gradle.kts -- the full set does
      # not fit the cache budget, and what CI is after comes out the same
      # against any one of them.
      - name: Plugin verifier (Linux only)
        if: runner.os == 'Linux'
        working-directory: jetbrains-plugin
        shell: bash
        run: |
          set -o pipefail
          ./gradlew verifyPlugin -PverifierIdes=idea --no-daemon 2>&1 | tee -a verification.log
      - name: Report verification warnings (Linux only)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: jetbrains-plugin
        shell: bash
        run: ./verification-report.sh verification.log

  visualstudio-extension:
    # Windows only, and not out of convenience: the client is a Visual Studio
    # extension. The default build is net8.0 / net8.0-windows (portable domain
    # plus the WPF panel), and the VSIX is net472, built by the MSBuild of a
    # Visual Studio installation because the VSSDK tasks are .NET Framework
    # tasks. No other runner has either half.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        working-directory: visualstudio-extension
        run: dotnet build GitReview.sln -v minimal
      # PanelLayoutContractTests compares the panel layout against
      # contracts/client-product-surface.yaml, the same anti-drift gate the
      # JetBrains `./gradlew test` carries.
      - name: Domain unit tests
        working-directory: visualstudio-extension
        run: dotnet test tests/GitReview.Domain.Tests --no-build -v minimal
      # The host layer: the refresh pipeline against a scripted CLI, plus the few
      # cases that need a real process (UTF-8 capture, the cwd, a missing
      # executable). Those spawn git, which every runner already has.
      - name: Host tests
        working-directory: visualstudio-extension
        run: dotnet test tests/GitReview.Host.Tests --no-build -v minimal
      - name: Layout smoke
        working-directory: visualstudio-extension
        run: dotnet run --project src/GitReview.VS --no-build -- --verify
      # net472 is off by default (GitReviewPackVsix), so whatever only breaks
      # there — the Compat shims, the VSSDK wiring, the vsixmanifest — is
      # invisible to every step above. This is the gate for it, and the only
      # check that the artifact users install still packs at all.
      - name: Build the VSIX (net472)
        working-directory: visualstudio-extension
        shell: pwsh
        run: ./build-vsix.ps1
