# Unique pin source for platform line / branch / plugin id (plan.md Technical Context).
# Verified against JetBrains build-number-ranges table:
#   2026.1 → branch 261, Java 21 (lowest supported; open until-build covers later).
pluginGroup = com.ezevillo
pluginName = git-review-workflow
pluginVersion = 0.1.1
pluginSinceBuild = 261
# Open-ended until-build (all future 261+ builds); pluginVerifier covers compatibility.
pluginUntilBuild =

# Compile/runIde host. IC is no longer published since 2025.3 — build against the
# *lowest* supported IntelliJ IDEA line so bytecode stays loadable on 2026.1+.
# Product *compatibility* is not this pin: plugin.xml depends on platform + Git4Idea
# (any JetBrains IDE that ships both) and excludes Android Studio + Rider via
# incompatible-with. verifyPlugin checks the claimed set at this same line.
platformVersion = 2026.1

# IntelliJ Platform Gradle Plugin version
intellijPlatformGradlePluginVersion = 2.18.1
kotlin.version = 2.3.20

# Opt-out of bundling Kotlin stdlib (platform already ships it)
kotlin.stdlib.default.dependency = false

# Config cache off: some verification tasks still touch Project in doLast.
org.gradle.configuration-cache = false
org.gradle.caching = true
