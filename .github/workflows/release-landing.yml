name: release-landing

# The landing has its own release cadence, independent of CLI/client tags.
on:
  push:
    tags:
      - "landing-v*"

permissions:
  contents: read

concurrency:
  group: landing-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate landing tag
        run: |
          set -eu
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^landing-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Expected a landing-vX.Y.Z tag; got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          if [ "$CLOUDFLARE_API_TOKEN_CONFIGURED" != true ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. Add the repository secret before tagging." >&2
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set. Add the repository secret before tagging." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check landing assets
        run: |
          node scripts/check-logo-assets.mjs
          node scripts/check-landing.mjs

      - name: Deploy tagged landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx --yes wrangler@4.148.0 deploy \
            --config "$GITHUB_WORKSPACE/wrangler.jsonc" \
            --assets "$GITHUB_WORKSPACE/docs" \
            --message "$GITHUB_REF_NAME ($GITHUB_SHA)"
