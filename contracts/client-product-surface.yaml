# Canonical multi-client product surface (anti-drift).
# Source of bootstrap strings: vscode-extension code as of 2026-08-08.
# Normative for CI: scripts/check-client-product-surface.mjs
schema_version: 1
# EL PISO DE CADA CLIENTE, Y NADA MAS QUE ESO.
#
# No es un escalar y no tiene default. Un default seria "el piso de quien no
# declaro" -- un valor que nadie eligio y todos heredan --, que es la forma que
# driftea en silencio; el mismo criterio con el que las dos filas de guias se
# emiten exista o no el archivo y con el que not_in: se verifica en las dos
# direcciones: se declara, no se implica.
#
# QUE LOS CUATRO DIFIERAN NO ES DRIFT: es el estado esperado. Cada cliente pide
# lo que realmente necesita, y ningun gate -- presente ni futuro -- puede exigir
# que sean iguales. La comparacion de cada cliente es un piso estricto: no hay
# techo, asi que una CLI mas nueva que el minimo nunca se reporta desactualizada.
min_cli_version:
  vscode: "0.8.0"        # verified: vscode-extension/src/cli/version.ts
  intellij: "0.8.0"      # verified: jetbrains-plugin/.../domain/Version.kt
  visualstudio: "0.8.0"  # verified: visualstudio-extension/src/GitReview.Domain/Version.cs
  tui: "0.8.0"           # sube a la version que introduce el verbo `ui`, en su propio commit
npm_install: "npm install -g git-review-workflow" # verified: src/cli/installHint.ts
npm_update: "npm install -g git-review-workflow@latest" # verified: src/cli/installHint.ts
docs_readme_url: "https://github.com/EzeVillo/git-review-workflow#readme"
support:
  star_url: "https://github.com/EzeVillo/git-review-workflow"
  # openSupport id "bug" — issue form lives at .github/ISSUE_TEMPLATE/bug_report.yml
  bug_url: "https://github.com/EzeVillo/git-review-workflow/issues/new?template=bug_report.yml"
# Storefront copy. Only what has to read the same in all three marketplaces
# lives here: the tagline (the one-liner under the plugin name in search results
# and on the listing) and the search keywords. The listing *body* is not shared
# — each marketplace takes a different artifact (VS Code renders the packaged
# README.md, JetBrains the <description> in plugin.xml, Visual Studio the
# overview.md pasted into the portal) — so it is reviewed by hand, not checked.
listing:
  # Los clientes que tienen ficha de tienda. La TUI no esta y esa es la
  # respuesta, no un hueco: se distribuye por Homebrew, los dos one-liner y el
  # binario del Release, y ninguna de esas vias tiene tagline ni keywords.
  applies_to: [vscode, intellij, visualstudio]
  # Byte-identical in all three. VS Code: package.json description (this exact
  # string). JetBrains: first sentence of the plugin.xml <description>. Visual
  # Studio: first sentence of vsixmanifest <Description> and of overview.md.
  tagline: "Walk a PR in order, then edit and run it — not just read the diff"
  # Compared as a set, case- and separator-insensitive: VS Code writes them
  # hyphenated in package.json keywords, Visual Studio spaced in vsixmanifest
  # Tags. JetBrains has no keyword field in the descriptor (Marketplace tags are
  # set in the portal) — nothing to check there.
  keywords: ["git", "review", "pull request", "code review", "walkthrough", "scm", "diff"]
strings:
  # verified: panelHtml.ts ~911
  cli_missing_title: "The git-review CLI ({min} or newer) was not found."
  # verified: panelHtml.ts ~917 — keep the word "installed"
  cli_outdated_title: "The installed git-review CLI is older than {min}."
  # verified: commands/setBase.ts
  no_base_candidates: "No branches to pick a base from were found."
  other_install_options: "Other install options"
  # Lo que el panel dice ANTES de su primera situacion resuelta, en los tres. No
  # es un estado vacio ni una situacion: es la unica frase que se puede decir sin
  # haber leido nada, y existe porque la alternativa —dibujar el estado semilla—
  # anunciaba una CLI ausente antes de que nadie hubiera mirado. Verificado
  # contra panelHtml.ts, ui/ReviewPanel.kt y ToolWindows/PanelView.cs.
  waiting_text: "Reading the review state…"
  # Lo que copyDraftPrompt pone en el portapapeles. Es un PUNTERO, no un prompt:
  # la consigna vive dentro del archivo, en el comentario de arriba de todo.
  # Byte por byte igual en los tres clientes; verificado contra
  # vscode-extension/src/review/userCopy.ts,
  # jetbrains-plugin/.../domain/UserCopy.kt y
  # visualstudio-extension/src/GitReview.Domain/UserCopy.cs
  draft_agent_prompt: >-
    Fill in the reading order at {path}. The instructions are inside the file,
    in the comment at the top. Do not change the file list or the numbering
    rules.
# COPY QUE CONTESTA LA MISMA SITUACION EN LOS CUATRO CLIENTES Y NO SE COMPARTE.
#
# strings: significa una sola cosa -- copy compartida byte por byte -- y una
# excepcion anotada adentro le sacaria ese significado. Lo que vive aca es lo
# contrario: la misma situacion, con el proximo paso distinto por cliente. En
# los dos casos el proximo paso esta FUERA del panel, que es por lo que hay que
# decirlo: en un IDE es abrir un workspace de una sola carpeta o recargar la
# ventana; en una terminal es pararse dentro de un repositorio, sin ventana que
# recargar.
#
# Que tres valores coincidan hoy NO es drift, por el mismo motivo que en
# min_cli_version: cada uno es la unica fuente de su cliente y ninguno hereda.
per_client_strings:
  # Se llamaba multi_root_error. El nombre nuevo dice la situacion y no una de
  # sus dos causas: en una terminal no hay multi-root, y la causa alcanzable es
  # la otra -- arrancar fuera de un repositorio.
  no_single_root:
    vscode: >-
      Open a single-folder workspace that is a git repository. git review uses
      one root (like the CLI cwd); multi-root is not supported.
    intellij: >-
      Open a single-folder workspace that is a git repository. git review uses
      one root (like the CLI cwd); multi-root is not supported.
    visualstudio: >-
      Open a single-folder workspace that is a git repository. git review uses
      one root (like the CLI cwd); multi-root is not supported.
    tui: >-
      Run git review ui from inside a git repository. A terminal has no
      multi-root to open — cd into one and try again.
  # Se llamaba reload_or_wait. El texto prometia que el panel vuelve a chequear
  # cada pocos segundos -- un poll, que FR-032 prohibe hacer y FR-069 prohibe
  # decir --, y en una terminal no hay ventana que recargar.
  after_install:
    vscode: >-
      Reload the window after installing, or wait — the panel checks again
      every few seconds.
    intellij: >-
      Reload the window after installing, or wait — the panel checks again
      every few seconds.
    visualstudio: >-
      Reload the window after installing, or wait — the panel checks again
      every few seconds.
    tui: >-
      Press r to refresh, or focus this pane again — the panel does not
      poll.
situations:
  - cli-missing
  - cli-outdated
  - no-review
  - finish-pending
  - review
  - finish-conflict
  - out-of-range
  - error
# 27 actions from vscode-extension package.json contributes.commands
# surface: panel | action | both
# situations: list of situation ids where enabled (plus busy/readonly notes)
# not_in: los clientes que deliberadamente NO ofrecen la accion, con el motivo al
#   lado. Se verifica en las dos direcciones — el cliente listado no la declara en
#   ninguna de sus superficies, y los demas si la siguen teniendo —, para que la
#   ausencia no se lea como drift y para que reaparecer cueste editar el contrato.
actions:
  openEntry:
    surface: both
    situations: [review, finish-conflict]
  openChange:
    surface: both
    situations: [review, finish-conflict]
  openAllChanges:
    surface: both
    situations: [review, finish-conflict]
    mode: whole
    # Visual Studio no la ofrece. Su servicio de diff (IVsDifferenceService) abre una
    # ventana de comparacion por par de archivos y no tiene equivalente del multi-diff
    # de VS Code (vscode.changes) ni de la DiffRequestChain de IntelliJ: "abrir todo"
    # ahi serian N ventanas de golpe, y una avalancha con tope sigue siendo una
    # avalancha. Las filas del inventario abren cada diff de a uno — la misma
    # informacion, en la unica forma que ese host puede darla bien.
    #
    # La TUI tampoco. Abrir N diffs de golpe no existe como gesto en un
    # multiplexor: no hay una superficie que sostenga N ventanas, y N
    # invocaciones seguidas del difftool del usuario es una avalancha, no una
    # accion. Las filas del inventario abren cada diff de a uno, igual que
    # arriba.
    not_in: [visualstudio, tui]
  showWhy:
    surface: both
    situations: [review, finish-conflict]
  next:
    surface: both
    situations: [review]
    requires_not_busy: true
  prev:
    surface: both
    situations: [review]
    requires_not_busy: true
  goToEntry:
    surface: both
    situations: [review, finish-conflict]
    requires_not_busy: true
  refresh:
    surface: both
    situations: [cli-missing, cli-outdated, no-review, finish-pending, review, finish-conflict, out-of-range, error]
  installCli:
    surface: both
    situations: [cli-missing, cli-outdated]
  continueReview:
    surface: panel
    situations: [no-review]
  startReview:
    surface: both
    situations: [no-review, finish-pending]
    requires_not_busy: true
  setBase:
    surface: both
    situations: [cli-missing, cli-outdated, no-review, finish-pending, review, finish-conflict, out-of-range, error]
    requires_not_busy: true
    requires_sole_cwd: true
  setRemote:
    surface: both
    situations: [cli-missing, cli-outdated, no-review, finish-pending, review, finish-conflict, out-of-range, error]
    requires_not_busy: true
    requires_sole_cwd: true
  abortReview:
    surface: both
    situations: [review, finish-conflict]
    requires_not_busy: true
  saveReview:
    surface: both
    situations: [review]
    requires_not_busy: true
  finishReview:
    surface: both
    situations: [review]
    requires_not_busy: true
    requires_not_readonly: true
  undoFinish:
    surface: both
    situations: [finish-pending, finish-conflict]
    requires_not_busy: true
  resumeFinish:
    surface: both
    situations: [finish-conflict]
    requires_not_busy: true
  discardInventory:
    surface: panel
    situations: [no-review]
  cleanReview:
    surface: both
    situations: [cli-missing, cli-outdated, no-review, finish-pending, review, finish-conflict, out-of-range, error]
    requires_not_busy: true
  forgetReview:
    surface: both
    situations: [cli-missing, cli-outdated, no-review, finish-pending, review, finish-conflict, out-of-range, error]
    requires_not_busy: true
  previewEdits:
    surface: both
    situations: [review, finish-conflict]
    requires_not_busy: true
  previewEditsStat:
    surface: both
    situations: [review, finish-conflict]
    requires_not_busy: true
  compareReview:
    surface: both
    situations: [cli-missing, cli-outdated, no-review, finish-pending, review, finish-conflict, out-of-range, error]
    requires_not_busy: true
  walkthroughInit:
    surface: both
    situations: [cli-missing, cli-outdated, no-review, finish-pending, review, finish-conflict, out-of-range, error]
    requires_not_busy: true
  walkthroughBuild:
    surface: both
    situations: [cli-missing, cli-outdated, no-review, finish-pending, review, finish-conflict, out-of-range, error]
    requires_not_busy: true
  showCliLog:
    surface: both
    situations: [cli-missing, cli-outdated, no-review, finish-pending, review, finish-conflict, out-of-range, error]

# EL ALFABETO DE ICONOS. Un control que lleva icono lo declara acá con `icon:`,
# y el nombre es el MISMO en los tres clientes -- lo que cambia es de dónde sale
# el dibujo: un SVG inline en VS Code, un AllIcons de la plataforma en JetBrains,
# un carácter del BMP en Visual Studio (ese host no tiene Image Catalog fuera del
# VSIX). Nombres semánticos y no del trazo: `prev` y no `left`, porque lo que el
# canónico fija es qué significa el icono, y el chevrón es una decisión de cada
# cliente.
#
# Existe porque el icono era lo único de un control que ningún lado declaraba, y
# los dos clientes que lo DERIVAN del id (JetBrains y Visual Studio) se olvidaron
# del mismo control dos veces seguidas: primero los tres pares de las guías y
# después el tacho de las ramas de ediciones. El primero cayó al nombre accesible
# --un botón del ancho de una oración en la cabecera de una fila-- y el segundo a
# la flecha de `next`, que es un icono válido y equivocado, o sea el que no se ve.
# `check-client-product-surface.mjs` verifica cada par (control, icono) contra las
# tres puntas, así que un control nuevo con icono no se puede olvidar en ninguna:
# hay que nombrarlo en las tres o CI se pone rojo.
#
# La dirección es canónico -> clientes. Un cliente puede mapear un id que el
# canónico no declara (dibujarlo es cosa suya); lo que no puede es dejar sin
# mapear uno que sí está acá.
icon_vocabulary: [prev, next, file, trash, diff]

# Disposición del panel, en orden. Normativo para:
#   - intellij: PanelLayoutContractTest compara la estructura completa
#   - vscode:   check-client-product-surface.mjs verifica lo de panel-layout.md § Verificación
# confirms: true cuando el comando asigna showWarningMessage y ramifica (panel-layout.md).
panel_layout:
  cli-missing:
    source_fns: [emptyCli, cliInstallHint]
    blocks:
      - {block: paragraph, key: cli_missing_title}
      - {block: paragraph, key: npm_install_hint}
      - {block: code_command, control: copyCliInstall, label: "Copy", raw_button: true, confirms: false}
      - {block: paragraph, key: after_install}
      - {block: row, controls: [{id: installCli, label: "Other install options", emphasis: link, confirms: false}]}
      - {block: stderr, when: present}
  cli-outdated:
    source_fns: [emptyCli, cliInstallHint]
    blocks:
      - {block: paragraph, key: cli_outdated_title}
      - {block: paragraph, key: npm_update_hint}
      - {block: code_command, control: copyCliInstall, label: "Copy", raw_button: true, confirms: false}
      - {block: paragraph, key: after_install}
      - {block: row, controls: [{id: installCli, label: "Other install options", emphasis: link, confirms: false}]}
      - {block: stderr, when: present}
  no-review-setup:
    source_fns: [renderSetup]
    blocks:
      - {block: paragraph, text: "Which branch do pull requests land on in this repo?"}
      - {block: row, controls: [{id: setBase, label: "Choose the branch", emphasis: primary, confirms: false}]}
      - {block: paragraph, text: "Reviews compare the branch you are reading against it. Usually main or develop."}
      - {block: paragraph, text: "Remote: {remote} (optional)."}
      - {block: row, controls: [{id: setRemote, label: "Change remote", emphasis: secondary, confirms: false}]}
  no-review:
    source_fns: [renderDrafts, renderReview, renderEmptyStartBlock, renderWalkthroughSection, renderWalkthroughRow, renderSpentDrafts, renderFixesSection, renderCompareSection, renderSettings, renderSupport]
    fills_height: true
    blocks:
      # Los borradores empezados van PRIMERO y el cuerpo de siempre sigue entero
      # debajo: no es una sub-disposición que reemplace, como no-review-setup.
      #
      # Sólo los FRESCOS. Un borrador cuya review terminó sobrevive -- clean no
      # toca prosa escrita a mano, y descartarlo es el verbo forget -- pero deja
      # de ser trabajo pendiente, así que baja a su propia sección plegada del
      # pie con los dos controles que le quedan sentido. Es el mismo draft_block
      # dibujado en dos lugares, y no dos bloques distintos: la fila es la misma
      # y lo único que cambia es cuál de los dos `when` la trae.
      # Sin base configurada no hay nada más que hacer en el panel; con un
      # borrador a medio escribir sí. Por eso es un bloque condicional dentro de
      # no-review y no una situación nueva -- que además obligaría a duplicar
      # toda esta lista de bloques.
      - {block: draft_block, when: has_fresh_drafts}
      - {block: heading, text: "Reviews in this repository", when: has_reviews}
      - {block: inventory_rows}
      - {block: paragraph, text: "No active review on this branch."}
      # SE CONFIRMA LO QUE NO SE PUEDE DESHACER, y `start` no es eso: se niega
      # solo con el arbol sucio, y una review empezada se cancela con un boton
      # del panel. El asistente ya pregunta cuatro cosas -- rama, origen, rango,
      # forma de lectura -- y la quinta pantalla repetia las cuatro respuestas y
      # agregaba el comando. Un cartel que aparece siempre deja de leerse, y
      # entonces tampoco se lee el que importa.
      #
      # El contexto que ese cartel daba -- que rama se va a revisar -- se mudo al
      # paso que ahora ejecuta: el titulo del picker de forma de lectura
      # (UserCopy.startLayoutTitle), que es el ultimo del asistente.
      - {block: row, controls: [{id: startReview, label: "Start a review", emphasis: primary, confirms: false}]}
      # Init, build y las dos guias de autoria vivian con Compare en una seccion
      # "Other actions". Se separaron cuando las guias entraron: cuatro controles
      # sobre el mismo sustantivo mas uno ajeno no es una lista de "otras
      # acciones", es un cajon. Agrupadas por sustantivo el panel dice lo mismo
      # que la CLI, donde los cuatro cuelgan de `git review walkthrough`.
      #
      # TRES FILAS Y NADA SUELTO ARRIBA. Init y build son la botonera de la fila
      # del walkthrough, no un `row` encima de ella: su sujeto es el archivo que
      # esa fila nombra, exactamente como Create es la botonera de cada guia.
      # Dibujados sueltos, la palabra "Walkthrough" se decia tres veces en cuatro
      # centimetros -- el titulo de la seccion, las dos etiquetas con prefijo y el
      # nombre de la fila -- y ninguna de las tres decia algo que las otras dos no.
      # Por eso las etiquetas van sin prefijo (el titulo de la seccion ya lo dice)
      # y la fila se llama por su rama. En el menu y la paleta siguen siendo
      # "Walkthrough: Init" / "Walkthrough: Build": ahi no hay seccion que de
      # contexto.
      #
      # Y la fila va SIN `when`: el registro nace en la version que los clientes
      # exigen como minimo, asi que siempre llega -- y colgar los dos verbos de una
      # fila condicional seria dejarlos sin superficie cuando la condicion no se
      # cumple.
      - block: tools_section
        title: "Walkthrough"
        blocks:
          - {block: walkthrough_row, controls: [{id: walkthroughInit, label: "Init", emphasis: secondary, confirms: true}, {id: walkthroughBuild, label: "Build", emphasis: secondary, confirms: true}]}
          - {block: guide_rows}
      # Los borradores gastados. Plegada y no escondida: un archivo que existe y
      # ninguna superficie nombra es el estado que este panel no deja pasar en
      # ningún otro lado, y esconder la fila se llevaría con ella el único
      # control que puede tirarlo sin deletrear su rama. La fila pierde los dos
      # controles con etiqueta (ver draft_controls) y conserva los dos iconos.
      - block: tools_section
        title: "Reading orders you finished with"
        when: has_reviewed_drafts
        blocks:
          - {block: paragraph, text: "Their review is over; the files are still here"}
          - {block: draft_block, when: has_reviewed_drafts}
      # Las ramas de ediciones que dejo un finish. Plegada y detras de los
      # ordenes terminados: las dos secciones son restos de reviews que ya
      # pasaron, y esta es la de mas abajo porque su contenido puede seguir
      # siendo trabajo pendiente de otra pantalla (commitear y pushear son de
      # Source Control), no de esta.
      #
      # "Discard all" corre clean --fixes-only SIN rama: por diseno de clean eso
      # enumera solo review-fixes/* y nunca toca review/* (sesiones vivas de
      # otras ramas), a diferencia de un `clean` a secas. Ver la nota de
      # fixes_rows para el resto del razonamiento. Su control vive en
      # fixes_rows.controls (junto a discardFixes) y no inline aca: declararlo
      # inline lo volveria obligatorio en TODA fixture no-review, incluidas las
      # que no traen fixes -- el chequeo de secuencia estricto por situacion
      # solo entiende gates de modo (walk/step/whole), no `when: has_fixes`.
      - block: tools_section
        title: "Edits you extracted"
        when: has_fixes
        blocks:
          - {block: paragraph, text: "One branch per finish; commit and push them from Source Control, or drop them here"}
          - {block: fixes_rows}
      # Compare, ultima de las tres del pie que hacen algo con el repo. Es la
      # unica que monta algo FUERA de una sesion de lectura -- dos revisiones
      # cualesquiera, sin review que empezar ni orden que escribir -- asi que va
      # debajo de todo lo que si tiene que ver con la review que estas por hacer.
      # Se llamaba "Other actions" y era la primera del pie: un titulo que no
      # nombra su contenido, encima de las dos secciones que si lo nombran.
      - block: tools_section
        title: "Compare"
        blocks:
          - {block: row, controls: [{id: compareReview, label: "Compare revisions", emphasis: secondary, confirms: true}]}
      - block: tools_section
        title: "Settings"
        blocks:
          - {block: paragraph, text: "Base: {base}."}
          - {block: row, controls: [{id: setBase, label: "Change the base branch", emphasis: secondary, confirms: false}]}
          - {block: paragraph, text: "Remote: {remote}."}
          - {block: row, controls: [{id: setRemote, label: "Change remote", emphasis: secondary, confirms: false}]}
      - block: tools_section
        title: "Support"
        blocks:
          - {block: row, controls: [{id: openSupport, label: "Star on GitHub", emphasis: secondary, raw_button: true, confirms: false}, {id: openSupport, label: "Report a bug", emphasis: secondary, raw_button: true, confirms: false}]}
  finish-pending:
    source_fns: [renderEmptyState]
    blocks:
      # EL PROXIMO PASO SE DICE SOLO SI ESTA FUERA DEL PANEL.
      #
      # Decia "...so you can undo with git review finish --abort, or
      # clean --keep-fixes when you no longer need the undo": los dos comandos
      # que nombraba esa frase son los dos botones dibujados abajo, a tres
      # centimetros. Un texto que manda a la terminal teniendo el control al
      # lado gasta la unica pantalla que el revisor lee entera despues de
      # cerrar, y le ensena una sintaxis que no necesita.
      #
      # Commitear y pushear SI se quedan: ese paso vive en Source Control, o
      # sea fuera de este panel, y esta es la unica superficie que puede
      # senalarlo.
      #
      # "Clean" solo no dice que limpia -- podia leerse como que se lleva las
      # ediciones. "Done, clean up" dice ademas cual de los dos cierra el
      # ciclo, que es la pregunta real de esta pantalla.
      - block: banner
        paragraphs:
          - "Your edits are on {destination}, staged and ready to commit."
          - "Commit and push them from Source Control. Until you clean up, this is still undoable."
        row:
          controls:
            - {id: cleanReview, label: "Done, clean up", emphasis: primary, confirms: true}
            - {id: undoFinish, label: "Undo", emphasis: secondary, confirms: true}
  out-of-range:
    source_fns: [render]
    blocks:
      - {block: paragraph, text: "The cursor is out of range: the base moved."}
      - {block: row, controls: [{id: outOfRangeHelp, label: "How to fix it", emphasis: primary, confirms: false}]}
      - {block: stderr, when: present}
  error:
    source_fns: [render]
    blocks:
      - {block: paragraph, text: "Something went wrong reading the review state."}
      - {block: row, controls: [{id: outOfRangeHelp, label: "How to fix it", emphasis: primary, confirms: false}]}
      - {block: stderr, when: present}
  # UNA REVIEW NO TIENE PIE: ninguna tools_section. Todo lo que cuelga de
  # `walkthrough` -- los dos verbos del autor y las dos guias de autoria -- es de
  # quien esta parado en SU PR, y adentro de una review estas parado en el de
  # otro. Una seccion titulada "Walkthrough" al pie del orden de lectura que
  # estas caminando ademas diria ese sustantivo por dos cosas distintas en la
  # misma pantalla. Todo eso vive en no-review, que es donde estan la fila del
  # walkthrough, sus verbos y las guias.
  review-walk:
    source_fns: [renderEntry, renderOpenRow, renderNavRow]
    blocks:
      - {block: identity_bar}
      - {block: notes}
      - {block: entry_head}
      - {block: entry_title}
      - {block: why}
      - {block: row, controls: [{id: showWhy, label: "open in editor", emphasis: link, confirms: false}], when: why_present}
      - {block: row, controls: [{id: openEntry, label: "File", emphasis: secondary, icon: file, confirms: false}, {id: openChange, label: "Diff", emphasis: secondary, icon: diff, confirms: false}]}
      - {block: row, controls: [{id: prev, label: null, accessible_name: "Previous entry", emphasis: icon, icon: prev, confirms: false}, {id: next, label: null, accessible_name: "Next entry", emphasis: icon, icon: next, confirms: false}]}
  review-step:
    source_fns: [renderEntry, renderOpenRow, renderNavRow, renderFiles]
    blocks:
      - {block: identity_bar}
      - {block: notes}
      - {block: entry_head}
      - {block: entry_title}
      - {block: row, controls: [{id: openChange, label: "Diff", emphasis: secondary, icon: diff, confirms: false}]}
      - {block: heading, text: "{n} file(s) in this commit"}
      - {block: file_rows}
      - {block: row, controls: [{id: prev, label: null, accessible_name: "Previous entry", emphasis: icon, icon: prev, confirms: false}, {id: next, label: null, accessible_name: "Next entry", emphasis: icon, icon: next, confirms: false}]}
  review-whole:
    source_fns: [renderFiles]
    blocks:
      - {block: identity_bar}
      - {block: notes}
      - {block: heading, text: "{n} file(s) in this review"}
      # ausente en visualstudio: ver not_in en la accion
      - {block: row, controls: [{id: openAllChanges, label: "Diff", emphasis: secondary, icon: diff, confirms: false, tooltip: "Open every change in this review at once"}], not_in: [visualstudio]}
      - {block: file_rows}
  finish-conflict:
    source_fns: [renderFinishConflictBanner, renderEntry, renderOpenRow, renderFiles]
    blocks:
      - {block: identity_bar}
      - block: banner
        paragraphs:
          - "This finish stopped at a conflict. Resolve the markers, then continue — or undo it to go back to editing."
        row:
          controls:
            - {id: undoFinish, label: "Undo", emphasis: secondary, confirms: true}
            - {id: resumeFinish, label: "Continue", emphasis: secondary, confirms: false}
      - {block: notes}
      - {block: entry_head}
      - {block: entry_title}
      - {block: why, when: walk}
      - {block: row, controls: [{id: showWhy, label: "open in editor", emphasis: link, confirms: false}], when: why_present}
      - {block: row, controls: [{id: openEntry, label: "File", emphasis: secondary, icon: file, confirms: false}, {id: openChange, label: "Diff", emphasis: secondary, icon: diff, confirms: false}], when: walk}
      - {block: row, controls: [{id: openChange, label: "Diff", emphasis: secondary, icon: diff, confirms: false}], when: step}
      - {block: heading, text: "{n} file(s) in this commit", when: step}
      - {block: file_rows, when: step}
      # navigation row intentionally absent

title_actions:
  - {id: refresh, label: "Refresh", confirms: false}
  - {id: finishReview, label: "Finish", when: "review && !readonly && !busy", confirms: false}
  - {id: saveReview, label: "Save", when: "review && !busy", confirms: true}
  - {id: abortReview, label: "Cancel", when: "(review|finish-conflict) && !busy", confirms: true}
  - {id: previewEdits, label: "Preview edits", when: "(review|finish-conflict) && !busy", confirms: false}


# LAS MUTACIONES QUE TRAEN EL PANEL A LA VISTA.
#
# «Lo que el panel muestra no se notifica» (CLAUDE.md § La copy de los paneles)
# tiene un supuesto que nadie garantizaba: que el panel esté A LA VISTA. El
# borrador nace en el asistente de inicio, que corre sobre el editor, y si la
# vista está cerrada o el sidebar está en otra pestaña, la fila nueva se dibuja
# donde nadie la ve — y como esa mutación tampoco notifica, no queda ningún
# acuse en ningún lado.
#
# Se REVELA y no se notifica: el acuse correcto es la cosa, no un párrafo sobre
# la cosa. Y sin robar el foco: el revisor sigue escribiendo donde estaba, lo que
# cambia es que el panel deja de estar tapado.
#
# LA LISTA ES CORTA A PROPÓSITO: sólo las mutaciones cuya respuesta es un bloque
# que ANTES NO ESTABA. Una guía que se crea, un borrador que se descarta, un
# cursor que avanza mueven una fila YA dibujada, y para verlas el panel tenía que
# estar a la vista de todos modos. Revelar en cada mutación es el mismo error que
# notificar en cada mutación, un escalón más arriba: si el panel salta siempre,
# deja de significar que pasó algo.
#
# Revelar cuando ya está visible es un no-op, así que la lista no distingue de
# dónde vino la acción — sería estado que ningún cliente tiene por qué llevar.
#
# NO cubre el scroll. Un panel visible pero scrolleado en el pie tampoco muestra
# la fila nueva, que nace primero en `no-review`; llevarlo al tope es otra
# superficie (un mensaje al webview en VS Code, otra cosa en cada host) y no
# entró acá.
reveals:
  # Los cuatro ids: startReview y startFromDraft cambian no-review a review (el
  # segundo desde la fila del borrador); continueReview idem, desde la review
  # pausada; finishReview cambia la situación a finish-pending, con su banner y
  # sus dos botones, y se dispara desde el título del panel y también desde la
  # paleta, donde el panel puede no estar a la vista. Los tres clientes de IDE
  # comparten el mecanismo: un panel que puede quedar fuera de vista y un
  # asistente que corre sobre el editor.
  vscode: [startReview, startFromDraft, continueReview, finishReview]
  intellij: [startReview, startFromDraft, continueReview, finishReview]
  visualstudio: [startReview, startFromDraft, continueReview, finishReview]
  # VACIA, Y DECLARADA. No es una ausencia: es la respuesta.
  #
  # Un pane lo abriste vos y ya esta a la vista, asi que no hay nada que
  # revelar; y robarle el foco a alguien en un multiplexor es agresion, no un
  # acuse. Si esto quedara como hueco, en seis meses alguien agrega un reveal y
  # nada se pone rojo -- que es exactamente lo que le paso a confirms:.
  tui: []
# existen como acción, nunca como control del panel
panel_excluded: [goToEntry, forgetReview, previewEditsStat, showCliLog]

# residuo de FR-036: no lo cubre el verificador de Node
panel_unverified:
  - "posición de los bloques que no son controles (párrafos, notas, badges)"
  - "condiciones de aparición (`when`) de los controles del cuerpo"

# Las dos guias de autoria, tal como el panel las dibuja. Son controles del
# CUERPO, como los del bloque de borradores: NO son acciones del producto, asi
# que el conteo fijo de 27 en actions: y en contributes.commands NO se toca, ni
# el menu Tools -> git review de JetBrains, ni el .vsct de Visual Studio.
#
# SIEMPRE DOS FILAS, en este orden, exista o no cada archivo. La CLI reporta las
# dos con y sin contenido (registro `guide` de config --porcelain) justamente
# para esto: un cliente no puede ofrecer crear una guia de la que nunca le
# hablaron, y rearmar el path de su lado es lo que la regla del path reportado
# existe para impedir.
#
# Lo que cambia con el estado es el enabled, nunca la presencia -- misma regla
# que draft_controls, y por el mismo motivo: dos filas que arman botoneras
# distintas no se alinean una con la otra.
guide_rows:
  # kind y etiqueta de cada fila. El estado va como badge al lado del nombre,
  # con estos tres valores literales. Dos son los de la CLI y el tercero no:
  # `absent` se dice "none", igual que en la fila del walkthrough de arriba. No
  # es por alinear las dos filas -- es que "empty" y "absent" se leen como
  # sinonimos de un vistazo, y son cosas distintas: `empty` es "el archivo esta,
  # no dice nada" y `absent` es "no hay archivo". La diferencia decide si el
  # boton de al lado abre o crea, asi que el badge tiene que distinguirlas sin
  # que nadie lea dos veces.
  rows:
    - {kind: team, label: "Repository guide"}
    - {kind: own, label: "Your guide"}
  states: ["in force", "empty", "none"]
  controls:
    # Abrir es mostrar: el cliente no interpreta un byte del archivo, y abre LA
    # RUTA QUE REPORTO LA CLI, nunca una derivada del layout del gitdir.
    openGuide: {label: null, accessible_name: "Open the guide", emphasis: icon, icon: file, confirms: false, disabled_when: absent, tooltip_disabled: "There is no guide yet"}
    # Crea el archivo VACIO invocando a la CLI (git review walkthrough guide
    # [--team]). El cliente no escribe archivos: si lo hiciera serian tres
    # implementaciones de "crear un archivo vacio" y tres chances de errarle al
    # path.
    createGuide: {label: "Create", emphasis: secondary, confirms: false, disabled_when: exists}
    # Solo en la fila `own`, y no por simetria olvidada: la compartida es un
    # archivo trackeado, asi que borrarla es git rm mas un commit -- una decision
    # sobre que entra al PR, que no es de este boton. La CLI dice lo mismo del
    # otro lado, negando --delete --team.
    discardGuide: {label: null, accessible_name: "Discard the guide", emphasis: icon, icon: trash, confirms: true, only_in_row: own, disabled_when: absent, tooltip: "Delete your guide"}
  # El watcher NO mira estos archivos, a diferencia de los borradores. El de la
  # guia propia vive en la raiz del gitdir, que cambia en cada operacion de git:
  # vigilarla seria una tormenta de refrescos por el archivo que menos cambia del
  # panel. El cliente que crea o descarta una refresca el mismo, dentro del lock.
  #
  # Lo que si escucha cada cliente es el GUARDADO del documento, y solo sobre las
  # rutas que la CLI reporto: onDidSaveTextDocument en VS Code, el evento de VFS
  # que produce un save en IntelliJ, OnAfterSave de la running document table en
  # Visual Studio. Sin eso hay un momento en que el panel miente -- apretas
  # Create, escribis las convenciones, Ctrl+S, y el badge sigue diciendo `empty`.
  watched: on_save

# La fila del walkthrough del autor, la primera de la tools_section
# "Walkthrough" y por encima de las dos guias. UNA sola fila, SIEMPRE (ver la
# nota del layout).
#
# Sus controles son de DOS clases y por eso estan declarados en dos lugares.
# `openWalkthrough` y `copyWalkthroughPrompt` son del CUERPO, como los de
# guide_rows y draft_controls: sin la fila que los dibuja no tienen sujeto, asi
# que viven en el mapa de abajo y NO cuentan contra las 27. `walkthroughInit` y
# `walkthroughBuild` si son acciones del producto -- estan en el menu y en la
# paleta como siempre --, asi que se declaran en el layout, adentro del bloque
# de esta fila, que es donde el panel los dibuja.
#
# Existe porque un walkthrough se escribe una vez, cuando el PR esta terminado,
# y despues el PR sigue moviendose -- vuelven los comentarios del review y
# cambian tres archivos. El verbo que lo diria es build, y correrlo hay que
# acordarselo justo en el momento en que nadie esta pensando en el walkthrough.
walkthrough_row:
  # El nombre de la fila es LA RAMA que ese walkthrough anota, tal como la
  # reporta el campo <branch> del registro -- nunca una derivada del cliente,
  # la misma regla que la ruta. Antes decia "Walkthrough" debajo de una seccion
  # titulada Walkthrough y encima de dos botones que empezaban con la palabra.
  #
  # `label_detached` es la unica copy propia de la fila, y se usa exactamente
  # cuando el registro omite el campo: con HEAD detached el archivo esta y los
  # dos verbos andan, pero la rama es una pregunta sin respuesta.
  label: from_branch
  label_detached: "Walkthrough"
  # Los badges, en prosa, uno por estado de la CLI. "may be out of date" y no
  # "out of date" a proposito: lo que la CLI compara en cada refresco es barato
  # y aproximado (si el rango se movio desde que el archivo se escribio), y la
  # respuesta exacta es de build. Un badge que afirma de mas sobre un archivo
  # que puede estar perfecto es peor que uno que sugiere mirar. Y `unknown` no
  # se pliega en `stale`: sin bloque de instrucciones la pregunta no tiene
  # respuesta, y contestar la peor de las dos manda a rehacer un orden que puede
  # estar bien.
  badges:
    in-sync: "up to date"
    stale: "may be out of date"
    superseded: "from a merged PR"
    unknown: "state unknown"
    absent: "none"
  # La etiqueta del boton walkthroughInit sigue al estado, porque el MISMO verbo
  # crea y actualiza: "Init" sobre un archivo lleno de prosa prometia lo que ese
  # verbo justamente ya no hace. Es la unica accion del producto cuya etiqueta
  # depende del estado; el precedente es discardInventory en inventory_controls.
  # Tres, no dos. `superseded` no es una variante de "quedo atras": el archivo es
  # de un PR ya mergeado y la CLI empieza de cero sola, asi que el boton dice lo
  # que va a pasar en vez de prometer una reconciliacion que no ocurre.
  action_labels:
    absent: "Init"
    present: "Update"
    superseded: "Start over"
  controls:
    # Abrir es mostrar: el cliente no interpreta un byte del archivo, y abre LA
    # RUTA QUE REPORTO LA CLI, nunca una derivada del layout del repositorio.
    openWalkthrough: {label: null, accessible_name: "Open the walkthrough", emphasis: icon, icon: file, confirms: false, disabled_when: absent}
    # Copia un PUNTERO al archivo, nunca la consigna: esa vive adentro del
    # propio walkthrough, en el comentario de arriba de todo, que es donde se
    # mantiene sola. Mismo reparto que copyDraftPrompt.
    copyWalkthroughPrompt: {label: "Copy for agent", emphasis: secondary, confirms: false, disabled_when: absent}
  # La eleccion entre reconciliar y empezar de cero, PREGUNTADA ANTES de invocar.
  #
  # Antes colgaba de que la CLI FALLARA: se corria init, y si moria porque el
  # archivo ya estaba, recien ahi los tres clientes ofrecian sobrescribir. Desde
  # que init actualiza en vez de negarse ese camino dejo de existir, y con el la
  # unica forma de llegar a --force desde un panel -- el codigo seguia ahi sin
  # que nada lo ejecutara. Por eso la pregunta va delante.
  #
  # Solo con el archivo presente y en un estado que se pueda reconciliar. Con
  # `absent` no hay nada que preservar, y con `superseded` la CLI empieza de cero
  # por su cuenta: preguntar ahi seria ofrecer preservar prosa de otro PR.
  init_choice:
    title: "This branch already has a walkthrough."
    update: "Update"
    start_over: "Start over"
    # El cuerpo del dialogo no se compara aca: es un parrafo largo y su lugar es
    # UserCopy, que es donde los tres lo escriben. Lo que si se verifica son las
    # tres cadenas de arriba, que son las que deciden que se aprieta.
  # El par annotated/total se dibuja solo con el archivo presente y total > 0,
  # por el mismo motivo que en draft_controls: 0/0 es "no hay nada aca", no
  # "esta completo".
  progress: when_present
  # El watcher NO mira este archivo. Vive en el work tree, asi que toda
  # operacion de git lo mueve, y el cliente que corre init/build refresca solo
  # -- como ya hace con las guias. Lo que si escucha cada cliente es el GUARDADO
  # del documento, sobre la ruta que la CLI reporto.
  watched: on_save

# Inventory control labels (variants) and body-only controls not in actions:
# continueReview, discardInventory (panel surface), copyCliInstall, outOfRangeHelp, openSupport,
# discardAllFixes
inventory_controls:
  continueReview: {label: "Continue", confirms: true}
  discardInventory:
    labels: ["Delete", "Delete leftover"]
    confirms: true

# Los cuatro controles de una fila del bloque de borradores. Son controles del
# CUERPO del panel, como copyCliInstall, outOfRangeHelp y openSupport: sin la
# fila que los dibuja no tienen sujeto. NO son acciones del producto, así que el
# conteo fijo de 27 en actions: y en contributes.commands NO se toca, ni el menú
# Tools -> git review de JetBrains, ni el .vsct de Visual Studio.
#
# LOS CUATRO ESTÁN SIEMPRE, EN ESTE ORDEN. Lo que cambia con el estado de la
# fila es el énfasis y el enabled, nunca la presencia: cuando startFromDraft
# desaparecía —el caso de <source>/<range> unknown, con el bloque de
# instrucciones borrado a mano— cada fila del bloque armaba una botonera
# distinta, así que ninguna se alineaba con la de al lado y el bloque entero se
# leía como un amontonamiento. Apagado no adivina los flags más que ausente
# (sigue sin poder invocarse) y encima dice por qué, que un control que no está
# no puede decir.
#
# Están en DOS lugares de la fila y eso también es fijo: los dos con etiqueta
# —los que mueven el flujo— en la botonera, y los dos de icono —los que actúan
# sobre el archivo de esa fila— pegados al par annotated/total de la cabecera.
# Los DOS con etiqueta se dibujan sólo en una fila FRESCA. Una cuya review ya
# terminó los pierde: el par de abajo es el flujo de escribir el orden y arrancar
# la review, y las dos cosas ya pasaron -- Copy for agent le pediría a un agente
# que complete lo que está completo, y Validate and start ofrecería releer un
# rango que se cerró. Los dos iconos se quedan en las dos filas, que es lo que
# hace que la sección plegada siga teniendo cómo abrir y cómo descartar.

# La FORMA de una fila del panel, comun a las tres clases que hay (inventario,
# borradores, guias + walkthrough). No es una accion ni un control: es donde caen
# las piezas que toda fila tiene, y esta aca porque los tres clientes la dibujan
# por separado y ya divergieron una vez.
row_shape:
  # El badge CIERRA la linea, siempre. Los controles de icono van antes, pegados a
  # el. Asi los estados de las tres secciones caen en la misma columna del borde
  # derecho; con el badge primero, cada fila lo dejaba a una distancia distinta del
  # borde segun cuantos iconos tuviera al lado.
  header: [name, "progress?", icons, badge]
  # La botonera de abajo. Dos columnas parejas SOLO donde hay exactamente dos
  # controles con etiqueta (las filas de borrador), que es lo que hace que una fila
  # se alinee con la de al lado. Con uno solo, celdas parejas estiran el boton a
  # media pantalla y le centran el texto -- se lee como un error de alineacion --,
  # y con tres aprietan etiquetas que entran como estan.
  actions:
    two_labelled: even_columns
    otherwise: left_at_label_width
  # Cada control de icono dibuja SU glifo. El default de esa decision no puede ser
  # otro icono: cuando openGuide/discardGuide/openWalkthrough no estaban mapeados,
  # un cliente los dibujo con el nombre accesible (un boton del ancho de una
  # oracion) y el otro con la flecha de "siguiente" -- o sea Discard con un ▶.
  icons: per_control

draft_controls:
  # Los dos con etiqueta entran en dos columnas de ancho parejo, y ahí el
  # énfasis es lo único que se mueve. Sigue al progreso y el ORDEN no: mientras
  # falten entradas el paso siguiente es llenar el borrador, y recién con el
  # orden completo lo es arrancar la review. `emphasis:` es el valor con el
  # borrador completo —`total > 0 && annotated >= total`—; `emphasis_unfilled:`
  # el de todo lo demás, que incluye `total == 0`. Sin la segunda clave el
  # énfasis no depende del progreso.
  #
  # El `total > 0` no es un borde teórico: la CLI emite el registro `draft` con
  # `0<TAB>0<TAB>unknown<TAB>unknown` tanto para un borrador vaciado a mano como
  # para el que un agente está escribiendo justo ahora —el watcher dispara con
  # el primer Changed, antes de que caiga el primer `## N.`—, y
  # `annotated >= total` a secas lee ese 0/0 como completo. La fila queda
  # dibujada como terminada y el énfasis se va a
  # startFromDraft, que con `unknown` está encima deshabilitado: el único
  # control enfático de la fila no se puede apretar, justo en el estado que más
  # necesita que copyDraftPrompt lidere. `total == 0` es "no hay nada acá", no
  # "está completo".
  copyDraftPrompt: {label: "Copy for agent", emphasis: secondary, emphasis_unfilled: primary, confirms: false}
  # Apagado por DOS motivos distintos, cada uno con su copy, y el de los flags
  # manda: sin bloque de instrucciones el build falla por deriva aunque el
  # orden esté completo, así que llenarlo no es el paso siguiente ahí.
  #
  # `tooltip_unfilled` es el otro, y existe porque el par annotated/total ya
  # cuenta TODO lo que build exige —una unidad por entrada más el heads-up—,
  # así que `annotated == total` es ahora la misma pregunta que "¿queda algún
  # placeholder?". Encendido sobre un borrador incompleto, el único control
  # enfático de la fila ofrecía un start que moría en "the heads-up placeholder
  # is still there". El costo conocido: el conteo sale del disco, así que con
  # el borrador abierto y sin guardar el control sigue gris hasta el Ctrl+S
  # —los tres clientes vigilan el directorio del borrador, así que el guardado
  # refresca solo—, y a cambio nadie arranca sobre un orden a medio escribir.
  # NO confirma, por lo mismo que startReview: `start` no destruye nada -- se
  # niega solo con el arbol sucio, y una review empezada se cancela con un boton
  # del panel. Este es el segundo de los dos caminos que llegan al start, y la
  # regla vale para los dos: el asistente y esta fila. Cuando hay un paso en el
  # medio (elegir keys only) ese paso nombra la rama, que es el unico contexto
  # que el cartel borrado daba.
  startFromDraft: {label: "Validate and start", emphasis: primary, emphasis_unfilled: secondary, confirms: false, tooltip: "Check the order, then start reading", tooltip_disabled: "This file lost its header, so it cannot be checked. Delete it and write a new one.", tooltip_unfilled: "Every file still needs a number and a line saying why it matters"}
  # Los dos de la FILA, y por eso salen de la botonera: no mueven el flujo, se
  # usan una vez cada tanto y su sujeto es el archivo que el par annotated/total
  # acaba de nombrar. Van como iconos pegados a ese par, lo que deja abajo dos
  # controles en dos columnas y una sola línea. Con los cuatro juntos la fila
  # medía el doble y el destructivo compartía caja y peso con el que arranca la
  # review — sacarle el relleno lo bajaba un escalón, pero un botón sin caja
  # entre botones con caja se lee como deshabilitado. Un icono no.
  #
  # Sin etiqueta visible, así que el `accessible_name` no es un extra: es el
  # nombre del control, y nombra la fila porque "Open" a secas se repite una vez
  # por borrador.
  openDraft: {label: null, accessible_name: "Open the reading order", emphasis: icon, icon: file, confirms: false}
  discardDraft: {label: null, accessible_name: "Discard the reading order", emphasis: icon, icon: trash, confirms: true, tooltip: "Delete this reading order"}

# Las ramas review-fixes/* que dejo un finish: la seccion "Edits you extracted"
# del pie de no-review. Su unico control es de FILA, como los de draft_controls y
# guide_rows -- sin la fila que lo dibuja no tiene sujeto --, asi que NO cuenta
# contra las 27 acciones ni va a contributes.commands, al menu Tools -> git review
# ni al .vsct.
#
# Existe porque era el ultimo estado del repositorio que ninguna superficie
# nombraba: list no las enumeraba, el inventario del panel sale de list, y el
# unico boton Clean del panel vive en el banner de finish-pending. Una rama de
# ediciones extraidas por review, para siempre, y sin forma de verlas ni de tirar
# una sola sin deletrear su nombre en una terminal.
#
# "Discard all" (declarado junto al bloque, no aca) corre clean --fixes-only
# SIN rama, nunca un `clean` a secas: por diseno de clean (bin/git-review-verbs/
# clean) eso enumera solo review-fixes/* y jamas toca una review/* viva de otra
# rama, que es el motivo por el que antes no habia boton. Sigue habiendo
# confirmacion con el detalle completo, porque lo que hay aca es trabajo
# escrito a mano y no basura de maquina; las filas de abajo -- badge por rama --
# siguen siendo el camino de default para quien quiere decidir rama por rama.
fixes_rows:
  # El nombre de la fila es LA RAMA, tal como la reporta el campo <name> del
  # registro `fixes` -- nunca una derivada del cliente, la misma regla que la
  # ruta de un borrador o de una guia.
  label: from_branch
  # Los badges, en prosa, uno por estado de la CLI. Dicen cuanto cuesta
  # descartarla, que es la unica pregunta que se hace en esta seccion.
  #
  # `empty` no se pliega en "seguro": una rama de fixes intacta esta parada en la
  # punta del PR y no contiene NADA tuyo, que es distinto de estar integrada.
  # `unknown` tampoco se pliega en `unmerged`: sin base configurada la pregunta
  # no tiene respuesta, y contestar la peor de las dos pinta de peligrosa una
  # rama que puede estar vacia.
  badges:
    empty: "empty"
    merged: "merged"
    unmerged: "unmerged"
    unknown: "unknown"
  controls:
    # Dos controles: uno de fila, destructivo sobre UNA rama de fixes, y uno de
    # seccion, destructivo sobre TODAS. Commitear y pushear son de Source
    # Control, que es donde el finish ya manda.
    #
    # discardFixes es icono y no boton con etiqueta, por lo mismo que
    # openDraft/discardDraft: el sujeto es la rama que la fila acaba de
    # nombrar, y "Discard" repetido una vez por fila es la etiqueta que menos
    # dice de todas. El accessible_name es el nombre real del control.
    #
    # SIEMPRE corre --fixes-only, incluso con la sesion cerrada: el argv no puede
    # depender de un dato que se relee en cada refresco, y un `clean <x>` que
    # llegue tarde -- la sesion volvio a existir entre el refresco y el click --
    # se llevaria puesta una review viva desde un boton que promete borrar una
    # rama de ediciones.
    discardFixes: {label: null, accessible_name: "Discard the extracted edits", emphasis: icon, icon: trash, confirms: true, disabled_when: current, tooltip: "Delete this branch of edits"}
    # discardAllFixes corre `clean --fixes-only` SIN rama: por diseno de clean
    # eso nunca toca review/* (ver la nota de arriba de este archivo), asi que
    # no tiene el problema de alcance que antes bloqueaba un boton asi. Vive en
    # este mapa -- control de la SECCION, no de una fila -- por el mismo motivo
    # que discardFixes: declararlo inline en panel_layout lo volveria
    # obligatorio en toda fixture no-review, incluidas las que no traen fixes.
    discardAllFixes: {label: "Discard all", emphasis: secondary, confirms: true}
  # La fila en la que estas parado no se puede borrar y lo dice, en vez de
  # ofrecer un boton que la CLI va a rechazar con "skipping (currently checked
  # out)". Es el mismo reparto que hace el inventario con la review activa.
  tooltip_current: "You are on this branch; switch away first"
  # El watcher NO mira nada aca: estas son ramas, o sea refs, y toda mutacion que
  # las crea o las borra pasa por la CLI o por git -- las dos cosas que los tres
  # clientes ya refrescan. No hay un archivo que vigilar.
  watched: no

# EL MAPA DE TECLAS DE LA TUI. Vive aca y no solo en el cliente por lo mismo
# que icon_vocabulary: es lo ultimo de un control que nadie declaraba, y un
# cliente que lo deriva solo se olvida de la mitad. `only_in: [tui]` porque los
# otros tres reciben sus atajos del IDE.
#
# LA BARRA DE TECLAS SE DIBUJA DE ESTE MISMO MAPA, asi que una tecla que existe
# y no se muestra es imposible por construccion. Y la regla de copy se aplica
# igual: si la tecla esta en pantalla, la tecla ES el texto.
keymap:
  only_in: [tui]
  # Movimiento de la LISTA. No mueve el cursor de la review.
  movement:
    - {keys: [j, down], does: focus_next_row}
    - {keys: [k, up], does: focus_prev_row}
  # El cursor de la REVIEW. n/p estan RESERVADAS para esto y para nada mas: es
  # un concepto distinto de navegar la lista, y confundirlos es el error que
  # esta reserva existe para impedir.
  cursor:
    - {keys: [n], action: next}
    - {keys: [p], action: prev}
  actions:
    - {keys: [r], action: refresh}    # en las OCHO situaciones (FR-038)
    # ... un renglon por accion con tecla, a medida que el cliente las cablea
  overlays:
    - {keys: [":"], opens: action_list}   # el equivalente de surface: action
    - {keys: [g], opens: entry_picker}    # goToEntry
  toggles:
    - {keys: [m], toggles: mouse_reporting}
