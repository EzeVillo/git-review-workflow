name: release-vscode

# The VS Code extension versions independently of the CLI and the other
# clients. The Marketplace refuses a version it already has, so publishing is
# tied to the immutable version tag rather than to a branch push.
on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and check it matches package.json
        id: ver
        run: |
          set -eu
          version="${GITHUB_REF_NAME#vscode-v}"
          stamped="$(node -p "require('./vscode-extension/package.json').version")"
          if [ "$version" != "$stamped" ]; then
            echo "tag is ${GITHUB_REF_NAME} but vscode-extension/package.json has version ${stamped}." >&2
            echo "Run ./vscode-extension/bump-version.sh ${version} and tag that commit." >&2
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Check the Marketplace token is configured
        env:
          PUBLISH_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          set -eu
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "VS_MARKETPLACE_TOKEN is not set." >&2
            echo "Create a Marketplace (Manage) token and add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile and typecheck
        working-directory: vscode-extension
        run: npm run pretest

      - name: Unit tests
        working-directory: vscode-extension
        run: npm run test:unit

      - name: Integration tests
        working-directory: vscode-extension
        run: xvfb-run -a npm run test:integration

      - name: Package the VSIX
        working-directory: vscode-extension
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          npm run package
          vsix="git-review-workflow-${VERSION}.vsix"
          if [ ! -s "$vsix" ]; then
            echo "expected the packaged extension at ${vsix}." >&2
            exit 1
          fi

      - name: Publish the packaged VSIX to the VS Code Marketplace
        working-directory: vscode-extension
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PUBLISH_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          set -eu
          vsix="git-review-workflow-${VERSION}.vsix"
          npx vsce publish --packagePath "$vsix" --pat "$PUBLISH_TOKEN"

      - name: Create the GitHub release with the VSIX attached
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          vsix="vscode-extension/git-review-workflow-${VERSION}.vsix"
          if [ ! -s "$vsix" ]; then
            echo "expected the packaged extension at ${vsix}." >&2
            exit 1
          fi
          notes="$(mktemp)"
          awk -v v="## [${VERSION}]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' vscode-extension/CHANGELOG.md >"$notes"
          if [ ! -s "$notes" ]; then
            echo "See vscode-extension/CHANGELOG.md" >"$notes"
          fi
          gh release create "$GITHUB_REF_NAME" "$vsix" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VS Code extension ${VERSION}" \
            --notes-file "$notes" \
            --latest=false
