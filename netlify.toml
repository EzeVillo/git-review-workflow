# Static landing only: no CLI/client build, dependencies, or secrets.
[build]
  base = "docs"
  publish = "."
  command = ""
  # Exit 0 skips deployment; exit 1 continues, including the first deployment.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ]; then exit 1; fi; if git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../netlify.toml; then exit 0; else exit 1; fi'
