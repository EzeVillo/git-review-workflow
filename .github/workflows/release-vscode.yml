name: release-vscode

# The VS Code extension versions independently of the CLI and the other
# clients. The Marketplace refuses a version it already has, so publishing is
# tied to the immutable version tag rather than to a branch push.
on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and check it matches package.json
        id: ver
        run: |
          set -eu
          version="${GITHUB_REF_NAME#vscode-v}"
          stamped="$(sed -nE 's#^  "version": "([^"]*)".*#\1#p' vscode-extension/package.json)"
          if [ "$version" != "$stamped" ]; then
            echo "tag is ${GITHUB_REF_NAME} but vscode-extension/package.json has version ${stamped}." >&2
            echo "Run ./vscode-extension/bump-version.sh ${version} and tag that commit." >&2
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Check the Marketplace token is configured
        env:
          PUBLISH_TOKEN_CONFIGURED: ${{ secrets.VS_MARKETPLACE_TOKEN != '' }}
        run: |
          set -eu
          if [ "$PUBLISH_TOKEN_CONFIGURED" != true ]; then
            echo "VS_MARKETPLACE_TOKEN is not set." >&2
            echo "Create a Marketplace (Manage) token and add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile and typecheck
        working-directory: vscode-extension
        run: npm run pretest

      - name: Unit tests
        working-directory: vscode-extension
        run: npm run test:unit

      - name: Integration tests
        working-directory: vscode-extension
        run: xvfb-run -a npm run test:integration

      - name: Package the VSIX
        working-directory: vscode-extension
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          npm run package
          vsix="git-review-workflow-${VERSION}.vsix"
          if [ ! -s "$vsix" ]; then
            echo "expected the packaged extension at ${vsix}." >&2
            exit 1
          fi

      # A draft is the durable copy of the first VSIX this tag built. If the
      # Marketplace upload or final publication fails, a retry downloads this
      # exact archive rather than rebuilding a ZIP with different timestamps.
      - name: Create or recover the GitHub release artifact
        id: release_asset
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          vsix="vscode-extension/git-review-workflow-${VERSION}.vsix"
          if [ ! -s "$vsix" ]; then
            echo "expected the packaged extension at ${vsix}." >&2
            exit 1
          fi
          notes="$(mktemp)"
          awk -v v="## [${VERSION}]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' vscode-extension/CHANGELOG.md >"$notes"
          if [ ! -s "$notes" ]; then
            echo "See vscode-extension/CHANGELOG.md" >"$notes"
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            recovery_dir="$(mktemp -d)"
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$(basename "$vsix")" \
              --dir "$recovery_dir"
            vsix="$recovery_dir/$(basename "$vsix")"
            if [ ! -s "$vsix" ]; then
              echo "existing GitHub release ${GITHUB_REF_NAME} has no recoverable VSIX." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$vsix" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VS Code extension ${VERSION}" \
              --notes-file "$notes" \
              --draft \
              --latest=false
          fi
          echo "vsix=${vsix}" >>"$GITHUB_OUTPUT"

      - name: Publish the release VSIX to the VS Code Marketplace
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PUBLISH_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          VSIX: ${{ steps.release_asset.outputs.vsix }}
        run: |
          set -eu
          vsix="$VSIX"
          checksum="$(sha256sum "$vsix" | awk '{ print tolower($1) }')"
          if metadata="$(npx vsce show EzeVillo.git-review-workflow --json 2>/dev/null)"; then
            if printf '%s' "$metadata" | node vscode-extension/scripts/marketplace-vsix-status.mjs "$VERSION" "$checksum"; then
              echo "VS Code Marketplace already has the matching VSIX for version ${VERSION}; continuing the release recovery."
            else
              status=$?
              if [ "$status" -eq 3 ]; then
                npx vsce publish --packagePath "$vsix" --pat "$PUBLISH_TOKEN"
              else
                exit "$status"
              fi
            fi
          else
            npx vsce publish --packagePath "$vsix" --pat "$PUBLISH_TOKEN"
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          notes="$(mktemp)"
          awk -v v="## [${VERSION}]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' vscode-extension/CHANGELOG.md >"$notes"
          if [ ! -s "$notes" ]; then
            echo "See vscode-extension/CHANGELOG.md" >"$notes"
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VS Code extension ${VERSION}" \
            --notes-file "$notes" \
            --draft=false \
            --latest=false
